  description: >
    <p>Conducted research on deep learning-based phishing detection, developing an end-to-end experimental framework for data acquisition, 
    automated processing, and model evaluation. I architected a fully automated data engineering pipeline that ingested, transformed, 
    and merged heterogeneous data from multiple sources into a unified format, designed to adapt to changing source schemas seamlessly. 
    On the modeling side, I designed and compared several neural network architectures—including RNNs (GRU) and CNNs with multi-level 
    embeddings—using Keras's functional API to evaluate their effectiveness across diverse, large-scale phishing datasets.</p>

    <p>More details are available in the repository's <a target="_new" href="https://github.com/MJafarMashhadi/Haplophysh/blob/master/README.md">readme</a> and
    the 1-page <a target="_new" href="https://github.com/MJafarMashhadi/Haplophysh/raw/master/ExtendedAbstract.pdf">extended abstract</a>.</p>
- name: Inferring State Models from Black-box Software Using Hybrid Deep Neural Networks
  active: May 2019 - Sep. 2020
  source_code: https://github.com/sea-lab/hybrid-net
  url: https://github.com/sea-lab/hybrid-net
  featured: true
  country: canada
  sorting_tags:
    - academic
    - python
    - tensorflow
    - mle
  tags:
    - Python
    - TensorFlow
    - Keras
    - Deep Learning
    - Machine Learning
    - Time series
    - Recurrent Neural Networks
    - Convolutional Neural Networks
    - Transfer Learning
  description: >
    <p>Developed as an MSc project in collaboration with <a href="https://www.micropilot.com/" target="_new" rel="nofollow">MicroPilot Inc</a>, 
    this research focused on generating state models for UAV autopilot software to enhance testing and verification. 
    I designed a hybrid deep neural network combining convolutional and recurrent layers to predict system states 
    from sensor readings and servo outputs using a black-box approach, ensuring the method remains generalizable 
    across different autopilot systems.</p>

    <p>The project involved building a custom data pipeline using TensorFlow's Dataset API to handle large-scale, 
    non-standardized industrial datasets efficiently. I implemented custom Keras layers for sequence masking 
    and developed specialized loss functions to address the unique challenges of telemetry data evaluation. 
    The research demonstrated that high-fidelity state models could be inferred without requiring access to 
    the underlying source code.</p>

    <p>This work was published in the <b>ASE '20</b> conference (<a href="https://sea-lab.github.io/papers/2020-Hybrid.pdf" target="_blank" rel="nofollow">read here</a>). 
    A follow-up study, <i>"Deep state inference: Toward behavioral model inference of black-box software systems"</i>, 
    was published in <b>IEEE Transactions on Software Engineering (TSE '21)</b>. The project was further extended 
    to include hyper-parameter optimization and transfer learning, details of which are available in my 
    <a href="https://github.com/MJafarMashhadi/University-of-Calgary-Graduate-Thesis" target="_blank" rel="nofollow">thesis</a>.</p>
