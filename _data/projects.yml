- name: Sequence 2 Script
  active: March. - May. 2019
  source_code: https://github.com/sequence2script/sequence2script.github.io
  url: https://www.psychpgxlab.com/projects/sequence2script
  featured: true
  country: canada
  sorting_tags:
    - hackathon
    - python
    - production
  tags:
    - Python
    - AWS
    - Postgresql
    - Leadership
    - Startup
  description: >
    <p>This project started during the Neuro Nexus hackathon in March 2019. We developed a tool to assist laboratories 
    and clinicians in translating pharmacogenomic testing results into clinically useful recommendations. The recommendations
    are based on expert guidelines developed by the Clinical Pharmacogenetics Implementation Consortium (CPIC) and the Royal 
    Dutch Association for the Advancements of Pharmacy - Pharmacogenetics Working Group (DPWG). </p>

    <p>As the technical lead, I coordinated the initial brainstorming sessions, defined project goals and milestones, 
    and managed task allocation. We built an <a href="https://sequence2script.github.io/" target="_new">online tool</a> 
    with an intuitive interface for clinicians. I architected and implemented the backend using Python and deployed 
    it as a serverless application on AWS Lambda. I also managed the integration of the front-end and the data pipeline, 
    ensuring the project met its objectives and deadlines.</p>

    <p>This experience provided significant growth in leadership and technical architecture, particularly in leveraging 
    AWS services for rapid prototype development in a high-pressure environment.</p>
